<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ScribeAI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex flex-col min-h-screen bg-pink-50">
    <!-- Navbar -->
    <nav class="bg-pink-300 p-4 text-pink-900 flex justify-between items-center">
        <h1 class="font-bold text-3xl">
            ScribeAI
        </h1>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow container mx-auto mt-10 mb-10 px-4 flex items-center justify-center">
        <div class="w-full max-w-md">

            <!-- Login Card -->
            <div class="p-6 border border-pink-500 bg-pink-100 rounded-lg">
                <h2 class="font-bold text-3xl text-pink-950 text-center">
                    Masuk ke
                    <span class="text-pink-900 underline">ScribeAI</span>
                </h2>

                <form id="loginForm" class="mt-6 space-y-4">
                    <div>
                        <label for="username" class="block font-semibold text-pink-950 mb-1">
                            Username
                        </label>
                        <input id="username" type="text" placeholder="Username kamu" required name="username"
                            class="w-full border border-pink-500 rounded-md bg-white px-3 py-2 text-pink-950 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
                    </div>

                    <div>
                        <label for="password" class="block font-semibold text-pink-950 mb-1">
                            Password
                        </label>
                        <input id="password" type="password" placeholder="Masukkan password" required name="password"
                            class="w-full border border-pink-500 rounded-md bg-white px-3 py-2 text-pink-950 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
                    </div>

                    <br><br>

                    <button type="submit"
                        class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold px-5 py-2 rounded-md transition-colors">
                        Masuk
                    </button>
                </form>

                <p class="mt-5 text-center text-pink-950">
                    Belum punya akun?
                    <a href="register.html" class="text-pink-700 font-semibold hover:underline">Daftar di sini</a>
                </p>
            </div>

        </div>
    </div>

    <footer class="text-center p-4 text-black">
        <a href="https://github.com/Encrypsy" class="text-gray-500">
            &copy; Malya Maritza, 2026
        </a>
    </footer>

    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // TODO: ganti dengan fetch/POST ke endpoint login Django kamu, contoh:

            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },

            //         email: document.getElementById('email').value,
            //         password: document.getElementById('password').value
            //     })
            // });
            console.log('Form login disubmit');
        });
    </script>
</body>

</html>
