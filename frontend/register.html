<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - ScribeAI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex flex-col min-h-screen bg-pink-50">
    <!-- Navbar -->
    <nav class="bg-pink-300 p-4 text-pink-900 flex justify-between items-center">
        <h1 class="font-bold text-3xl">
            ScribeAI
        </h1>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow container mx-auto mt-10 mb-10 px-4 flex items-center justify-center">
        <div class="w-full max-w-md">

            <!-- Register Card -->
            <div class="p-6 border border-pink-500 bg-pink-100 rounded-lg">
                <h2 class="font-bold text-3xl text-pink-950 text-center">
                    Daftar ke
                    <span class="text-pink-900 underline">ScribeAI</span>
                </h2>

                <form id="registerForm" class="mt-6 space-y-4">
                    <div>
                        <label for="username" class="block font-semibold text-pink-950 mb-1">
                            Username
                        </label>
                        <input id="username" name="username" type="text" placeholder="Masukkan username kamu" required
                            class="w-full border border-pink-500 rounded-md bg-white px-3 py-2 text-pink-950 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
                    </div>

                    <div>
                        <label for="email" class="block font-semibold text-pink-950 mb-1">
                            Email
                        </label>
                        <input id="email" name="email" type="email" placeholder="nama@email.com" required
                            class="w-full border border-pink-500 rounded-md bg-white px-3 py-2 text-pink-950 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
                    </div>

                    <div>
                        <label for="password" class="block font-semibold text-pink-950 mb-1">
                            Password
                        </label>
                        <input id="password" name="password" type="password" placeholder="Buat password" required
                            class="w-full border border-pink-500 rounded-md bg-white px-3 py-2 text-pink-950 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
                    </div>

                    <div>
                        <label for="repeatPassword" class="block font-semibold text-pink-950 mb-1">
                            Konfirmasi password
                        </label>
                        <input id="repeatPassword" name="repeatPassword" type="password" placeholder="Ulangi password" required
                            class="w-full border border-pink-500 rounded-md bg-white px-3 py-2 text-pink-950 placeholder-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-500">
                    </div>

                    <br>

                    <button type="submit"
                        class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold px-5 py-2 rounded-md transition-colors">
                        Daftar
                    </button>
                </form>

                <p class="mt-5 text-center text-pink-950">
                    Sudah punya akun?
                    <a href="login.html" class="text-pink-700 font-semibold hover:underline">Masuk di sini</a>
                </p>
            </div>

        </div>
    </div>

    <footer class="text-center p-4 text-black">
        <a href="https://github.com/Encrypsy" class="text-gray-500">
            &copy; Malya Maritza, 2026
        </a>
    </footer>

    <script>
        const registerForm = document.getElementById('registerForm');

        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Password dan konfirmasi password tidak sama.');
                return;
            }

            // TODO: ganti dengan fetch/POST ke endpoint register Django kamu, contoh:
            // const response = await fetch('/register/', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({
            //         name: document.getElementById('name').value,
            //         email: document.getElementById('email').value,
            //         password: password
            //     })
            // });
            console.log('Form register disubmit');
        });
    </script>
</body>

</html>
